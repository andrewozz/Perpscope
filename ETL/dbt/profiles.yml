perpscope:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: perpscope_marts # default; +schema in dbt_project.yml overrides per layer
      location: US
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
